<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="introduction">
          <h1>Poem generator</h1>
          <div>
            <a href="https://www.shecodes.io/" target="_blank"
              ><img src="images/shecodes.png" alt="SheCodes logo"
            /></a>
          </div>
        </div>
        <p class="about">
          Coded with 💜 by
          <a href="https://github.com/AnaBRibeiro" target="_blank"
            >Ana Ribeiro</a
          >, as a project for a
          <span class="shecodes-workshop">SheCodes AI Workshop</span>
        </p>
      </header>
      <div class="form-container">
        <form id="poem-generator-form">
          <input
            class="form-user-instructions"
            type="text"
            placeholder="Enter the topic of the poem"
            autofocus
            autocomplete="off"
            required
            id="user-instructions"
          />
          <input
            class="form-submit-button"
            type="submit"
            value="Generate poem"
          />
        </form>
        <p class="hint">e.g., flower, Paris, cheese, ...</p>
      </div>
      <div class="poem-container poem-container-hidden" id="poem-text"></div>
      <footer>
        This project is hosted on
        <a
          href="https://shecodes-project-ai-poem-generator.netlify.app/"
          target="_blank"
          >Netlify</a
        >
        and is available as open source on
        <a
          href="https://github.com/AnaBRibeiro/ai-poem-generator"
          target="_blank"
          >GitHub</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
